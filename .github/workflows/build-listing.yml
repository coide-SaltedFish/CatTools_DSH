name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  release:
    types: [published, created, edited, unpublished, deleted, released]

# 部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4

      # 官方 listing 生成器;clean: false 以免清掉上面的 checkout
      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      # 官方 action 在服务器构建下不会自建发布目录,必须先 mkdir,否则写 index.json 会失败
      - name: Create Publish Directory
        run: mkdir -p "${{ env.listPublishDirectory }}"

      # 读 VpmListing/Website 下的模板,渲染进发布目录并生成 index.json
      - name: Build Package Version Listing
        run: >
          ${{ env.pathToCi }}/build.cmd BuildRepoListing
          --root ${{ env.pathToCi }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }}
          --package-listing-source-folder $GITHUB_WORKSPACE/VpmListing
          --current-package-name sereinfish.cat.tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 静态资源要自己拷:服务器构建下 action 只写 index.json / index.html / app.js
      - name: Copy Static Assets Into Publish Directory
        run: |
          for f in banner.png favicon.ico styles.css; do
            if [ -f "VpmListing/Website/$f" ]; then
              cp "VpmListing/Website/$f" "${{ env.listPublishDirectory }}/$f"
            fi
          done

      # 部署前打印生成结果,便于排查
      - name: Show Generated Listing
        run: |
          echo "--- ${{ env.listPublishDirectory }} ---"
          ls -la "${{ env.listPublishDirectory }}"
          echo "--- index.json ---"
          cat "${{ env.listPublishDirectory }}/index.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.listPublishDirectory }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
