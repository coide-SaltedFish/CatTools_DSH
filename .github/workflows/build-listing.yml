name: Build Repo Listing

env:
  listPublishDirectory: Website
  pathToCi: ci

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Build Release]
    types: [completed]
  release:
    types: [published, created, edited, unpublished, deleted, released]

# 允许部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一次 Pages 部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    name: build-listing
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 取出本仓库(包本体 + Website 站点资源模板)
      - name: Checkout Local Repository
        uses: actions/checkout@v4

      # 取出官方 listing 生成器(不清理前面的 checkout)
      - name: Checkout Automation Repository
        uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ${{ env.pathToCi }}
          clean: false

      # 构建 listing 需要 NuGet 缓存
      - name: Restore Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.pathToCi }}/.nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj') }}

      # action 在服务器构建下不会创建发布目录(它只在本地构建时清理/复制),
      # 所以这里必须先建好,否则写 index.json 时会 DirectoryNotFoundException。
      - name: Create Publish Directory
        run: mkdir -p "${{ env.listPublishDirectory }}"

      # 生成 index.json,并把站点模板渲染进发布目录。
      #
      # 官方 action 的三个相关路径(见 package-list-action 的 Build.cs):
      #   PackageListingSourcePath = <sourceFolder>/source.json
      #   WebPageSourcePath        = <sourceFolder>/Website     (读 index.html / app.js 模板)
      #   ListPublishDirectory     = --list-publish-directory   (写 index.json / index.html / app.js)
      # 模板目录与发布目录必须是两个不同目录,否则会自我覆盖。
      # 因此把 source.json 与 Website/ 模板一起放在 VpmListing/ 下,
      # 渲染结果写到根目录的 Website/。
      - name: Build Package Version Listing
        run: >
          ${{ env.pathToCi }}/build.cmd BuildRepoListing
          --root ${{ env.pathToCi }}
          --list-publish-directory $GITHUB_WORKSPACE/${{ env.listPublishDirectory }}
          --package-listing-source-folder $GITHUB_WORKSPACE/VpmListing
          --current-package-name sereinfish.cat.tools
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发布前把静态资源补进发布目录(server 构建下 action 只写那三个文件,
      # 只有本地构建才会整目录拷贝)
      - name: Copy Static Assets Into Publish Directory
        run: |
          for f in banner.png favicon.ico styles.css; do
            if [ -f "VpmListing/Website/$f" ]; then
              cp "VpmListing/Website/$f" "${{ env.listPublishDirectory }}/$f"
            fi
          done

      # 部署前把生成结果打出来,便于排查
      - name: Show Generated Listing
        run: |
          echo "--- ${{ env.listPublishDirectory }} ---"
          ls -la "${{ env.listPublishDirectory }}"
          echo "--- index.json ---"
          cat "${{ env.listPublishDirectory }}/index.json"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.listPublishDirectory }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
